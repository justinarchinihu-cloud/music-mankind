<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Darvin | Music Mankind</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
  </style>
</head>
<body class="darvin-page">
  <div class="torus-background"></div>

  <header class="site-header">
    <div class="logo">
      <a href="{{ url_for('home') }}">Music Mankind</a>
    </div>

    <nav class="main-nav">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('gallery') }}">Gallery</a>
      <a href="{{ url_for('music') }}">Music</a>
      <a href="{{ url_for('audio_visualizer') }}">EQ Visualizer</a>
      <a href="{{ url_for('my_library') }}">My Library</a>
      <a href="{{ url_for('about') }}">About</a>
    </nav>
  </header>

  <div class="page-shell">
    <main class="page-inner">
      <section class="artist-hero">
        <div class="artist-avatar">
          <img src="{{ url_for('static', filename=profile_image) }}" alt="Darvin">
        </div>
        <div class="artist-meta">
          <h1>{{ artist_name }}</h1>
          <p>Electronic Soul • Producer • Storyteller</p>
          <p>{{ location }}</p>
          <p class="latest">Latest Releases: {{ latest_releases }}</p>
        </div>
      </section>

      <section class="release-section">
        <h2>Singles</h2>
        <div class="release-list">
          {% for song in songs %}
          <article class="release-card">
            <h3>{{ song.title }}</h3>
            <p>{{ song.release_type | title }}</p>
            <audio controls preload="metadata" src="{{ url_for('static', filename=song.filename) }}">
              Your browser does not support the audio element.
            </audio>
          </article>
          {% endfor %}
        </div>
      </section>
    </main>
  </div>
</body>
</html>
