{% extends "base.html" %}

{% block content %}

<section class="artist-profile-page">

    <!-- BACK BUTTON -->
    <a class="back-link" href="{{ url_for('home') }}">← Home</a>

    <!-- ARTIST HERO -->
    <section class="artist-hero darvin-hero">

        <div class="artist-hero-overlay">

            <div class="artist-avatar">
                <img
                    src="{{ url_for('static', filename=profile_image) }}"
                    alt="Darvin">
            </div>

            <div class="artist-meta">

                <p class="label">Artist</p>

                <h1>{{ artist_name }}</h1>

                <p>Electronic Soul • Producer • Storyteller</p>

                <p>{{ location }}</p>

                <p class="latest">
                    Latest Releases: {{ latest_releases }}
                </p>

            </div>

        </div>

    </section>

    <!-- SONG SECTION -->
    <section class="release-section">

        <h2>Singles</h2>

        <div class="release-list">

            {% for song in songs %}
            <article class="release-card">

                <h3>{{ song.title }}</h3>

                <p>{{ song.release_type | title }}</p>

                <audio
                    controls
                    preload="metadata"
                    src="{{ url_for('static', filename=song.filename) }}">
                </audio>

            </article>
            {% endfor %}

        </div>

    </section>

</section>

{% endblock %}
