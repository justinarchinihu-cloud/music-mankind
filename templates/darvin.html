{% extends "base.html" %}

{% block content %}

<a class="back-link" href="/">← Home</a>

<section class="artist-profile-page">

    <!-- HERO (MATCHES JUSTIN + EVAN SYSTEM) -->
    <div class="artist-hero darvin-hero-bg"></div>

        <div class="artist-hero-overlay">

            <img class="artist-profile-pic"
                 src="{{ url_for('static', filename='images/darvin.jpg') }}"
                 alt="Darvin">

            <div>
                <p class="label">Artist</p>
                <h1>Darvin</h1>
                <p class="subtitle">Electronic Soul • Producer • Storyteller</p>
                <p class="subtitle">Jacksonville</p>
                <p class="subtitle">
                    Latest Releases: Doomed / Kiss In The Wind MP3
                </p>
            </div>

        </div>

    </div>

    <!-- ALBUMS / SINGLES (FIXED AUDIO PATHS) -->
    <section class="albums-section">

        <h2>Singles</h2>

        <!-- TRACK 1 -->
        <div class="album-card">

            <audio controls>
                <source src="{{ url_for('static', filename='Audio/doomed.mp3') }}" type="audio/mpeg">
                Your browser does not support audio playback.
            </audio>

            <div class="album-info">
                <h3>Doomed</h3>
                <p>Single</p>
            </div>

        </div>

        <!-- TRACK 2 -->
        <div class="album-card">

            <audio controls>
                <source src="{{ url_for('static', filename='Audio/kiss_in_the_wind.mp3') }}" type="audio/mpeg">
                Your browser does not support audio playback.
            </audio>

            <div class="album-info">
                <h3>Kiss In The Wind</h3>
                <p>Single</p>
            </div>

        </div>

    </section>

</section>

{% endblock %}
